<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rabbit & Fox // Little Space</title>
    <style>
        :root {
            --bg-color: #fff0f3;
            --panel-bg: #ffffff;
            --primary: #ff85a1;
            --primary-hover: #ff7096;
            --accent: #fbb1bd;
            --text-main: #4a4e69;
            --text-muted: #9a8c98;
            --border: #ffe5ec;
            --card-bg: #fff8f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .cute-card {
            background: var(--panel-bg);
            border: 2px solid var(--border);
            border-radius: 24px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 15px 35px rgba(255, 133, 161, 0.15);
            overflow: hidden;
        }

        .card-header {
            background: #ffe5ec;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
            color: #ff5d8f;
            letter-spacing: 0.5px;
        }

        .card-body {
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .question-box {
            background: var(--card-bg);
            border: 2px dashed #ffccd5;
            border-radius: 18px;
            padding: 26px 20px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .category-tag {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ff758f;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 16px;
            line-height: 1.6;
            font-weight: 600;
            color: #594a4e;
        }

        textarea {
            width: 100%;
            height: 110px;
            background: #ffffff;
            border: 2px solid #ffccd5;
            border-radius: 16px;
            color: var(--text-main);
            padding: 14px;
            font-size: 14px;
            resize: none;
            outline: none;
            transition: all 0.2s;
        }

        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(255, 133, 161, 0.2);
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        button {
            flex: 1;
            padding: 13px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .btn-draw {
            background: #ff85a1;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(255, 133, 161, 0.3);
        }

        .btn-draw:hover:not(:disabled) {
            background: var(--primary-hover);
        }

        .btn-submit {
            background: #ffccd5;
            color: #594a4e;
        }

        .btn-submit:hover:not(:disabled) {
            background: #ffb3c1;
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            box-shadow: none;
        }

        .footer-note {
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
        }

        /* 自訂可愛彈窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(2px);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-box {
            background: #ffffff;
            border: 2px solid #ffe5ec;
            border-radius: 20px;
            padding: 24px 30px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(255, 133, 161, 0.25);
            max-width: 320px;
            width: 85%;
        }

        .modal-message {
            font-size: 15px;
            font-weight: 600;
            color: #4a4e69;
            margin-bottom: 18px;
        }

        .modal-btn {
            background: #ff85a1;
            color: #fff;
            padding: 8px 24px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="cute-card">
    <div class="card-header">
        <div class="card-title">🐰 Rabbit & Fox // Little Space 🦊</div>
    </div>

    <div class="card-body">
        <div class="question-box">
            <div class="category-tag" id="qCategory">Ready?</div>
            <div class="question-text" id="qText">Click "Draw a Question" to see what the rabbit prepared for you</div>
        </div>

        <textarea id="answerInput" placeholder="Write your answer here..." disabled></textarea>

        <div class="btn-group">
            <button class="btn-draw" id="btnDraw" onclick="drawQuestion()">Draw a Question 🎲</button>
            <button class="btn-submit" id="btnSubmit" onclick="submitAnswer()" disabled>Send Answer 💌</button>
        </div>

        <div class="footer-note">Every answer goes straight to the rabbit</div>
    </div>
</div>

<div class="modal-overlay" id="customModal">
    <div class="modal-box">
        <div class="modal-message" id="modalText">Don't leave it blank! 😈</div>
        <button class="modal-btn" onclick="closeModal()">OK</button>
    </div>
</div>

<script>
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRgHmPt83mlah6CgZVoad0oNvC1XbaUGz4tkDATEKrSBABxOh6z765dGrVIbhE54nqsc9oEEbnaxGkl/pub?output=csv";
    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1548316493849305159/vz2IRdJnK0pRW9cOCfOHV8VKPMVJkVG5xIITST0ypHdpzgtoXKicqPLKsuZ1yxCCmiqx";

    let questionPool = [];
    let currentQuestion = null;

    function showAlert(msg) {
        document.getElementById('modalText').innerText = msg;
        document.getElementById('customModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('customModal').style.display = 'none';
    }

    async function fetchQuestions() {
        try {
            const res = await fetch(GOOGLE_SHEET_CSV_URL);
            const data = await res.text();
            parseCSV(data);
        } catch (e) {
            document.getElementById('qText').innerText = "Oops! Couldn't load questions right now.";
        }
    }

    function parseCSV(csvText) {
        const rows = csvText.split('\n').filter(row => row.trim() !== '');
        questionPool = [];
        for (let i = 1; i < rows.length; i++) {
            const cols = rows[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            if (cols.length >= 2) {
                questionPool.push({
                    category: cols[0].replace(/"/g, '').trim(),
                    question: cols[1].replace(/"/g, '').trim(),
                    author: cols[2] ? cols[2].replace(/"/g, '').trim() : 'Rabbit'
                });
            }
        }
    }

    function drawQuestion() {
        if (questionPool.length === 0) {
            showAlert("Questions are still loading, please wait a moment!");
            return;
        }

        const randomIndex = Math.floor(Math.random() * questionPool.length);
        currentQuestion = questionPool[randomIndex];

        document.getElementById('qCategory').innerText = `Category: ${currentQuestion.category}`;
        document.getElementById('qText').innerText = currentQuestion.question;

        document.getElementById('btnDraw').disabled = true;
        document.getElementById('answerInput').disabled = false;
        document.getElementById('answerInput').value = "";
        document.getElementById('answerInput').focus();
        document.getElementById('btnSubmit').disabled = false;
    }

    async function submitAnswer() {
        const answer = document.getElementById('answerInput').value.trim();
        if (!answer) {
            showAlert("Don't leave it blank! 😈");
            return;
        }

        document.getElementById('btnSubmit').disabled = true;

        const discordPayload = {
            username: "Rabbit & Fox HQ",
            avatar_url: "https://i.pinimg.com/736x/21/d9/b4/21d9b4b0e3bebe7b233a0ea7d08d87aa.jpg",
            embeds: [
                {
                    title: "🦊 The Fox has sent an answer!",
                    color: 16745889,
                    fields: [
                        {
                            name: "📂 Topic",
                            value: currentQuestion.category,
                            inline: true
                        },
                        {
                            name: "❓ Question",
                            value: currentQuestion.question,
                            inline: false
                        },
                        {
                            name: "💬 Fox's Answer",
                            value: answer,
                            inline: false
                        }
                    ],
                    timestamp: new Date().toISOString()
                }
            ]
        };

        try {
            await fetch(DISCORD_WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(discordPayload)
            });

            document.getElementById('answerInput').value = "";
            document.getElementById('answerInput').disabled = true;
            document.getElementById('btnDraw').disabled = false;
            document.getElementById('qCategory').innerText = "Sent Successfully";
            document.getElementById('qText').innerText = "Your answer was delivered. Ready for the next one?";
        } catch (error) {
            showAlert("Something went wrong, please try again!");
            document.getElementById('btnSubmit').disabled = false;
        }
    }

    window.onload = fetchQuestions;
</script>
</body>
</html>
